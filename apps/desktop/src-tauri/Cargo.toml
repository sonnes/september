[package]
name = "september-desktop"
version = "0.2.0"
description = "September desktop shell"
edition = "2021"

[lib]
name = "september_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
keyring = { version = "3", features = ["apple-native"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "net", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
whoami = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.22.1", default-features = false, features = ["av", "dispatch", "macos_14_2", "vn"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "window_state"
harness = false
