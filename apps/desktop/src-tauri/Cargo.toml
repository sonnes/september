[package]
name = "september-desktop"
version = "0.1.0"
description = "September desktop shell"
edition = "2021"

[lib]
name = "september_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
rfd = "0.17"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
whoami = "1.6"

[dev-dependencies]
tempfile = "3"
